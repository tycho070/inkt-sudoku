# Zet de web-apps automatisch online via GitHub Pages bij elke push naar main:
#   web/      -> Inkt     op  /inkt-sudoku/
#   neural-planner/  -> Neural Planner  op  /inkt-sudoku/neural-planner/
#   synapse/         -> doorverwijzing  op  /inkt-sudoku/synapse/ (oude naam)
name: Publiceer web-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Site samenstellen (Inkt + Neural Planner)
        run: |
          mkdir _site
          cp -r web/. _site/
          for app in neural-planner synapse; do
            if [ -d "$app" ]; then
              mkdir "_site/$app"
              cp -r "$app/." "_site/$app/"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
