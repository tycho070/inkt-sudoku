<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Synapse heet nu Neural Planner</title>
    <!-- Synapse is hernoemd naar Neural Planner en verhuisd. Dit oude adres stuurt door. -->
    <meta http-equiv="refresh" content="0; url=../neural-planner/" />
    <script>
      // Oude service worker van Synapse opruimen, daarna doorsturen.
      (async () => {
        try {
          const reg = await navigator.serviceWorker?.getRegistration("./");
          if (reg && new URL(reg.scope).pathname.endsWith("/synapse/")) await reg.unregister();
        } catch {}
        location.replace("../neural-planner/");
      })();
    </script>
    <style>
      body { background: #07090f; color: #e6ebf5; font-family: system-ui, sans-serif; padding: 2rem; }
      a { color: #6ea8ff; }
    </style>
  </head>
  <body>
    <p>Synapse heet nu <a href="../neural-planner/">Neural Planner</a>. Je wordt doorgestuurd…</p>
  </body>
</html>
