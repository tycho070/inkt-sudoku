<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Synapse-icoon: vier taken (knopen) met afhankelijkheden. Alles binnen de
       middelste 80%, zodat Android het icoon ook rond of als druppel mag afsnijden. -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.25" r="0.95">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="syn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.55" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="none" stroke="url(#syn)" stroke-width="14" stroke-linecap="round">
    <path d="M170 186 Q246 176 306 246"/>
    <path d="M306 246 Q344 292 346 352"/>
    <path d="M170 186 Q160 284 214 346"/>
  </g>
  <g stroke-width="12">
    <circle cx="170" cy="186" r="36" fill="#0b1020" stroke="#34d399"/>
    <circle cx="306" cy="246" r="36" fill="#0b1020" stroke="#fbbf24"/>
    <circle cx="346" cy="352" r="30" fill="#0b1020" stroke="#6ea8ff"/>
    <circle cx="214" cy="346" r="30" fill="#0b1020" stroke="#6ea8ff"/>
  </g>
  <circle cx="170" cy="186" r="13" fill="#34d399"/>
  <circle cx="306" cy="246" r="13" fill="#fbbf24"/>
  <circle cx="346" cy="352" r="11" fill="#6ea8ff"/>
  <circle cx="214" cy="346" r="11" fill="#6ea8ff"/>
</svg>
